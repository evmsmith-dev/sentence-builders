# Tests, builds and deploys the site to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"] # documentation only: nothing to test or deploy
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks and the site build (the deploy uses this build).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the sentences
        run: npm run validate:items
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # End-to-end tests, four machines in parallel: every test on the phone (split in two), and the @layout
  # tests on desktop and tablet. They use the Chrome already installed on GitHub's runners (no download).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: phone, shard: 1/2 }
          - { project: phone, shard: 2/2 }
          - { project: desktop, shard: 1/1 }
          - { project: tablet, shard: 1/1 }
    name: e2e (${{ matrix.project }} ${{ matrix.shard }})
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and end-to-end tests
        run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
